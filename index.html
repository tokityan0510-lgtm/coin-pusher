<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f1a" />
    <title>Coin Pusher</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="drop-zone"><span>ここをタップしてメダル投入</span></div>
    <div id="banner"></div>
    <div id="hud">
      <div id="credit-box" class="credits">
        <span class="label">CREDIT</span><span id="credits">0</span>
        <div id="popups"></div>
      </div>
      <div id="session"></div>
      <button id="refill" type="button" hidden>メダル補充 +50</button>
      <button id="mute" type="button">🔊</button>
    </div>
    <div id="loading">読み込み中…</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
